parameters:
  - name: runningAgent
    displayName: Pick agent to run
    type: string
    default: ubuntu-latest
    values:
      - ubuntu-latest
      - azp-agent-ubuntu-docker
      - azp-agent-debian-docker
      - azp-agent-debian-docker-local

  - name: dependencies
    type: stepList
    default:
      - checkout: self

  - name: terraformVersion
    displayName: Terraform version
    type: string
    default: 1.8.5

  - name: tfWorkDir
    displayName: Terraform working directory
    type: string
    default: .

  - name: tfVarsFile
    displayName: Optional tfvars file path
    type: string
    default: ""

  - name: orgServiceUrl
    displayName: Azure DevOps organization URL
    type: string
    default: ""

  - name: personalAccessToken
    displayName: Azure DevOps Personal Access Token
    type: string
    default: ""

  - name: artifactFeed
    displayName: Azure Artifacts feed name
    type: string
    default: ""

  - name: statePackageName
    displayName: Universal Package name for tfstate
    type: string
    default: ""

  - name: adoProject
    displayName: Azure DevOps project name
    type: string
    default: ""

stages:
  - stage: Plan
    displayName: Plan
    jobs:
      - job: Validate
        displayName: Run validate
        workspace:
          clean: all
        pool:
          ${{ if eq(parameters.runningAgent, 'ubuntu-latest') }}:
            vmImage: ${{ parameters.runningAgent }}
          ${{ if ne(parameters.runningAgent, 'ubuntu-latest') }}:
            name: ${{ parameters.runningAgent }}
        steps:
          - ${{ parameters.dependencies }}

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: ${{ parameters.terraformVersion }}

          - bash: |
              set -euo pipefail
              az extension add --name azure-devops --only-show-errors

              LATEST_VERSION=$(az artifacts universal show \
                --organization "$ADO_ORG" \
                --project "$ADO_PROJECT" \
                --scope project \
                --feed "$FEED" \
                --name "$PACKAGE_NAME" \
                --query "versions[-1:][0].version" \
                -o tsv 2>/dev/null || echo "")

              if [ -z "$LATEST_VERSION" ]; then
                echo "No existing state found. Starting fresh."
              else
                echo "Downloading tfstate version: $LATEST_VERSION"
                az artifacts universal download \
                  --organization "$ADO_ORG" \
                  --project "$ADO_PROJECT" \
                  --scope project \
                  --feed "$FEED" \
                  --name "$PACKAGE_NAME" \
                  --version "$LATEST_VERSION" \
                  --path "$(Build.ArtifactStagingDirectory)/tfstate"

                cp "$(Build.ArtifactStagingDirectory)/tfstate/terraform.tfstate" "$TF_DIR/terraform.tfstate"
                echo "State restored at $TF_DIR/terraform.tfstate"
              fi
            env:
              ADO_ORG: ${{ parameters.orgServiceUrl }}
              ADO_PROJECT: ${{ parameters.adoProject }}
              FEED: ${{ parameters.artifactFeed }}
              PACKAGE_NAME: ${{ parameters.statePackageName }}
              TF_DIR: ${{ parameters.tfWorkDir }}
              AZURE_DEVOPS_EXT_PAT: ${{ parameters.personalAccessToken }}
            displayName: Download tfstate from Universal Packages

          - bash: |
              set -euo pipefail
              terraform -chdir="${TF_DIR}" init -input=false
              terraform -chdir="${TF_DIR}" fmt -check -recursive
              terraform -chdir="${TF_DIR}" validate
            env:
              TF_DIR: ${{ parameters.tfWorkDir }}
            displayName: Terraform init & validate

          - bash: |
              set -euo pipefail
              terraform -chdir="${TF_DIR}" plan \
                -input=false \
                -var-file="${TF_VARS_FILE}"
            env:
              TF_DIR: ${{ parameters.tfWorkDir }}
              TF_VARS_FILE: ${{ parameters.tfVarsFile }}
              AZDO_ORG_SERVICE_URL: ${{ parameters.orgServiceUrl }}
              AZDO_PERSONAL_ACCESS_TOKEN: ${{ parameters.personalAccessToken }}
            displayName: Terraform plan

  - stage: Checkov
    displayName: Checkov Scan
    dependsOn: Plan
    jobs:
      - job: ScanTerraform
        displayName: Run Checkov
        workspace:
          clean: all
        pool:
          ${{ if eq(parameters.runningAgent, 'ubuntu-latest') }}:
            vmImage: ${{ parameters.runningAgent }}
          ${{ if ne(parameters.runningAgent, 'ubuntu-latest') }}:
            name: ${{ parameters.runningAgent }}
        steps:
          - ${{ parameters.dependencies }}

          - bash: |
              set -euo pipefail
              python3 -m pip install --upgrade pip
              python3 -m pip install checkov
            displayName: Install Checkov

          - bash: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              checkov -d "${TF_DIR}" --soft-fail -o junitxml > "$(Build.ArtifactStagingDirectory)/checkov-report.xml"
            env:
              TF_DIR: ${{ parameters.tfWorkDir }}
            displayName: Run Checkov and generate JUnit report

          - task: PublishTestResults@2
            displayName: Publish Checkov report
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/checkov-report.xml
              testRunTitle: Checkov IaC Scan
              failTaskOnFailedTests: false
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: Publish Checkov artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/checkov-report.xml
              artifact: checkov-report
              publishLocation: pipeline
            condition: always()

  - stage: Apply
    displayName: Apply
    dependsOn: Checkov
    lockBehavior: sequential
    jobs:
      - job: RunTerraform
        displayName: Run Terraform
        workspace:
          clean: all
        pool:
          ${{ if eq(parameters.runningAgent, 'ubuntu-latest') }}:
            vmImage: ${{ parameters.runningAgent }}
          ${{ if ne(parameters.runningAgent, 'ubuntu-latest') }}:
            name: ${{ parameters.runningAgent }}
        steps:
          - ${{ parameters.dependencies }}

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: ${{ parameters.terraformVersion }}

          - bash: |
              set -euo pipefail
              az extension add --name azure-devops --only-show-errors

              LATEST_VERSION=$(az artifacts universal show \
                --organization "$ADO_ORG" \
                --project "$ADO_PROJECT" \
                --scope project \
                --feed "$FEED" \
                --name "$PACKAGE_NAME" \
                --query "versions[-1:][0].version" \
                -o tsv 2>/dev/null || echo "")

              if [ -z "$LATEST_VERSION" ]; then
                echo "No existing state found. Starting fresh."
              else
                echo "Downloading tfstate version: $LATEST_VERSION"
                az artifacts universal download \
                  --organization "$ADO_ORG" \
                  --project "$ADO_PROJECT" \
                  --scope project \
                  --feed "$FEED" \
                  --name "$PACKAGE_NAME" \
                  --version "$LATEST_VERSION" \
                  --path "$(Build.ArtifactStagingDirectory)/tfstate"

                cp "$(Build.ArtifactStagingDirectory)/tfstate/terraform.tfstate" "$TF_DIR/terraform.tfstate"
                echo "State restored at $TF_DIR/terraform.tfstate"
              fi
            env:
              ADO_ORG: ${{ parameters.orgServiceUrl }}
              ADO_PROJECT: ${{ parameters.adoProject }}
              FEED: ${{ parameters.artifactFeed }}
              PACKAGE_NAME: ${{ parameters.statePackageName }}
              TF_DIR: ${{ parameters.tfWorkDir }}
              AZURE_DEVOPS_EXT_PAT: ${{ parameters.personalAccessToken }}
            displayName: Download tfstate from Universal Packages

          - bash: |
              set -euo pipefail
              terraform -chdir="${TF_DIR}" init -input=false
            env:
              TF_DIR: ${{ parameters.tfWorkDir }}
            displayName: Terraform init

          - bash: |
              set -euo pipefail
              terraform -chdir="${TF_DIR}" apply --auto-approve \
                -input=false \
                -var-file="${TF_VARS_FILE}"
            env:
              TF_DIR: ${{ parameters.tfWorkDir }}
              TF_VARS_FILE: ${{ parameters.tfVarsFile }}
              AZDO_ORG_SERVICE_URL: ${{ parameters.orgServiceUrl }}
              AZDO_PERSONAL_ACCESS_TOKEN: ${{ parameters.personalAccessToken }}
            displayName: Terraform apply

          - bash: |
              set -euo pipefail
              NEW_VERSION="1.0.$(Build.BuildId)"

              mkdir -p "$(Build.ArtifactStagingDirectory)/tfstate"
              cp "$TF_DIR/terraform.tfstate" "$(Build.ArtifactStagingDirectory)/tfstate/terraform.tfstate"

              echo "Publishing tfstate as version $NEW_VERSION..."
              az artifacts universal publish \
                --organization "$ADO_ORG" \
                --project "$ADO_PROJECT" \
                --scope project \
                --feed "$FEED" \
                --name "$PACKAGE_NAME" \
                --version "$NEW_VERSION" \
                --path "$(Build.ArtifactStagingDirectory)/tfstate" \
                --description "tfstate from build $(Build.BuildId) on $(Build.SourceBranchName)"

              echo "Published tfstate version: $NEW_VERSION"
            env:
              ADO_ORG: ${{ parameters.orgServiceUrl }}
              ADO_PROJECT: ${{ parameters.adoProject }}
              FEED: ${{ parameters.artifactFeed }}
              PACKAGE_NAME: ${{ parameters.statePackageName }}
              TF_DIR: ${{ parameters.tfWorkDir }}
              AZURE_DEVOPS_EXT_PAT: ${{ parameters.personalAccessToken }}
            condition: succeeded()
            displayName: Publish tfstate to Universal Packages
