parameters:
  - name: runningAgent
    displayName: Pick agent to run
    type: string
    default: azp-agent-ubuntu-docker
    values:
      - ubuntu-latest
      - azp-agent-ubuntu-docker
      - azp-agent-debian-docker

  - name: dependencies
    type: stepList
    default:
      - checkout: one-press-resources
      - checkout: one-press-functions

  - name: checkoutBootstrapStage
    type: stepList
    default:
      - checkout: one-press-functions
        path: s/one-press-functions

  - name: checkoutBuildStage
    type: stepList
    default:
      - checkout: one-press-resources
        path: s/one-press-resources
      - checkout: one-press-functions
        path: s/one-press-functions

  - name: checkoutUnitTestStage
    type: stepList
    default:
      - checkout: one-press-resources
        path: s/one-press-resources
      - checkout: one-press-functions
        path: s/one-press-functions

  - name: condaBinPath
    type: string
    default: "/opt/miniconda3/bin"

  - name: workspaceWorkDir
    type: string
    default: "$(Agent.BuildDirectory)/w"

  - name: resourcesWorkDir
    type: string
    default: "$(Agent.BuildDirectory)/s/one-press-resources"

  - name: dockerResources
    type: string
    default: "resources/docker/dockerfiles"

  - name: functionsWorkDir
    type: string
    default: "$(Agent.BuildDirectory)/s/one-press-functions"

  - name: functionsResources
    type: string
    default: "app/functions"

  - name: targetSubDir
    type: string
    default: ""

  - name: pythonVenvPath
    type: string
    displayName: Virtual environment path for python
    default: "/data/.conda/envs"

  - name: functionsVenv
    type: string
    displayName: Name of functions venv
    default: "one-press-functions"

  - name: infrastructureVarVaultServiceConnection
    displayName: Name of service connection connect to base infrastructure vault
    type: string
    default: ""

  - name: infrastructureVarsVaultName
    displayName: Uri of docker
    type: string
    default: ""

  - name: stageEnvVars
    displayName: Required environment variables of stage
    type: object
    default:
      bootstrap:
        - SECRET-GIT-TOKEN
        - SECRET-GIT-USER
        - SECRET-DOCKER-SERVER-URI
      build:
        - SECRET-DOCKER-SERVER-PASSWORD
        - SECRET-DOCKER-SERVER-URI
        - SECRET-DOCKER-SERVER-USERNAME
        - SECRET-FEED-PASSWORD
        - SECRET-FEED-MAVEN-SERVER-URL
        - SECRET-FEED-USERNAME
      unitTest:
        - SECRET-FEED-PASSWORD
        - SECRET-FEED-MAVEN-SERVER-URL
        - SECRET-FEED-USERNAME

  - name: appFolder
    displayName: Name of app folder
    type: string
    default: "app_source"

  - name: bootstrapSectionFolder
    displayName: Name of Bootstrap section folder
    type: string
    default: "bootstrap_section"

  - name: bootstrapArtifactName
    displayName: Artifact's name of Bootstrap stage
    type: string
    default: "bootstrap"

  - name: buildSectionFolder
    displayName: Name of Build section folder
    type: string
    default: "build_section"

  - name: buildAppFolder
    displayName: Name of Build App folder
    type: string
    default: "build_app"

  - name: buildDockerFolder
    displayName: Name of Build Docker folder
    type: string
    default: "build_docker"

  - name: targetBuildApp
    displayName: Target to build app
    type: string
    default: ""

  - name: targetBuildOutput
    displayName: Target output of app
    type: string
    default: "target"

  - name: testSectionFolder
    displayName: Name of Test section folder
    type: string
    default: "test_section"

  - name: targetUnitTestApp
    displayName: Target unit test to test app
    type: string
    default: ""

  - name: targetUnitTestOutput
    displayName: Target output of test
    type: string
    default: ""

  - name: targetUnitTestOutputFilter
    displayName: Filter of test output
    type: string
    default: "*.xml"

  - name: gitUrl
    displayName: Git url
    type: string

  - name: isPrivateRepo
    displayName: Is private repo
    type: string

  - name: gitBranch
    displayName: Git branch
    type: string

  - name: gitUsername
    displayName: Git username
    type: string
    default: $(SECRET-GIT-USER)

  - name: gitToken
    displayName: Git token
    type: string
    default: $(SECRET-GIT-TOKEN)

  - name: publishFileName
    displayName: Name of artifact.
    type: string
    default: "metadata.json"

  - name: javaHome
    displayName: Path of Java home
    type: string
    default: /usr/lib/jvm/temurin-17-jdk-amd64

  - name: isUsePrivateLibs
    displayName: Maven use private repo
    type: string
    default: "true"

  - name: mavenSettingsPath
    displayName: Maven path of settings.xml
    type: string
    default: "resources/maven/config/settings.xml"

  - name: compileEnvVars
    displayName: Container required envs public
    type: object
    default:
      MAVEN_SERVER_URL: $(SECRET-FEED-MAVEN-SERVER-URL)
      MAVEN_SERVER_USERNAME: $(SECRET-FEED-USERNAME)
      MAVEN_SERVER_PASSWORD: $(SECRET-FEED-PASSWORD)

  - name: dockerTagBaseOnEnv
    displayName: Uri of docker
    type: string
    default: "false"

  - name: manuallyPublicEnvVars
    displayName: Public environment variables of container manually
    type: object
    default: {}

  - name: manuallyPrivateEnvVars
    displayName: Private environment variables of container manually
    type: object
    default: {}

  - name: hostPublicEnvVars
    displayName: Public environment variables load from host
    type: object
    default: {}

  - name: hostPrivateEnvVars
    displayName: Private environment variables load from host
    type: object
    default: {}

  - name: dockerfilePath
    displayName: Dockerfile path
    type: string

  - name: dockerImageName
    displayName: Docker image name
    type: string

  - name: dockerImageTag
    displayName: Docker image tag
    type: string
    default: $(Build.BuildNumber)

  - name: containerArgs
    displayName: Args of Dockerfile
    type: object
    default: ""

  - name: isPrivateHubRegistry
    displayName: Push docker image to registry
    type: string
    default: "true"

  - name: dockerServerUri
    displayName: Uri of docker
    type: string
    default: $(SECRET-DOCKER-SERVER-URI)

  - name: dockerServerUsername
    displayName: Username of docker
    type: string
    default: $(SECRET-DOCKER-SERVER-USERNAME)

  - name: dockerServerPassword
    displayName: Password of docker
    type: string
    default: $(SECRET-DOCKER-SERVER-PASSWORD)

  - name: pipelineName
    displayName: Name of pipeline.
    type: string
    default: $(Build.DefinitionName)

  - name: buildNumber
    displayName: Build number of pipeline.
    type: string
    default: $(Build.BuildNumber)

  - name: pythonRuntimeVersion
    displayName: Build number of pipeline.
    type: string
    default: python3.10

  - name: isUnitTestStage
    displayName: Run unit test
    type: boolean
    default: true

stages:
  - stage: Bootstrap
    jobs:
      - job: PreparePackages
        displayName: Prepare packages
        workspace:
          clean: all
        pool:
          ${{ if eq(parameters.runningAgent, 'ubuntu-latest') }}:
            vmImage: ${{ parameters.runningAgent }}
          ${{ if eq(parameters.runningAgent, 'azp-agent-ubuntu-docker') }}:
            name: ${{ parameters.runningAgent }}
          ${{ if eq(parameters.runningAgent, 'azp-agent-debian-docker') }}:
            name: ${{ parameters.runningAgent }}
        variables:
          - template: vars-cicd-k8s.yml
        steps:
          - ${{ parameters.checkoutBootstrapStage }}

          - task: AzureKeyVault@2
            inputs:
              azureSubscription: ${{ variables.FLOW_INFRA_CONFIG_VAULT_SERVICE_CONNECTION }}
              KeyVaultName: ${{ variables.FLOW_INFRA_CONFIG_VAULT_NAME }}
              SecretsFilter: "${{ join(',',parameters.stageEnvVars.bootstrap) }}"
              RunAsPreJob: true
            displayName: "Bootstrap: Fetch vars from vault"

          - bash: |
              echo "##vso[task.setvariable variable=PATH;]${CONDA_BIN_PATH}:${PATH}"
              echo "##vso[task.setvariable variable=PYTHONPATH;]${FUNCTIONS_WORK_DIR}:${PYTHONPATH}"
            env:
              CONDA_BIN_PATH: ${{ parameters.condaBinPath }}
              FUNCTIONS_WORK_DIR: "${{ parameters.functionsWorkDir }}"
            displayName: "Bootstrap: Set up env"

          - bash: |
              source activate $FUNCTIONS_VENV
              python $EXECUTE_COMMAND
            env:
              FUNCTIONS_VENV: ${{ parameters.functionsVenv }}
              EXECUTE_COMMAND: ${{ parameters.functionsWorkDir }}/app/main.py INITIALIZE_WORKSPACE
              STAGE_NAME: BOOTSTRAP
              BOOTSTRAP_BASE_DIR: "${{ parameters.workspaceWorkDir }}"
            displayName: "Bootstrap: Initialize workspace"

          - bash: |
              source activate $FUNCTIONS_VENV
              python $EXECUTE_COMMAND
            env:
              FUNCTIONS_VENV: ${{ parameters.functionsVenv }}
              EXECUTE_COMMAND: ${{ parameters.functionsWorkDir }}/app/main.py GIT_CLONE_ADO
              APP_SOURCE_PREFIX_PATH: $(FLOW_BOOTSTRAP_SECTION_DIR)
              APP_SOURCE: ${{ parameters.appFolder }}
              GIT_URL: ${{ parameters.gitUrl }}
              GIT_BRANCH: ${{ parameters.gitBranch }}
              IS_PRIVATE_REPO: ${{ parameters.isPrivateRepo }}
              GIT_USERNAME: ${{ parameters.gitUsername }}
              GIT_TOKEN: ${{ parameters.gitToken }}
              ARCHIVE_PATH: $(Build.ArtifactStagingDirectory)
            displayName: "Bootstrap: Clone source"

          # - bash: |
          #     source activate $FUNCTIONS_VENV
          #     python $EXECUTE_COMMAND
          #   env:
          #     FUNCTIONS_VENV: ${{ parameters.functionsVenv }}
          #     EXECUTE_COMMAND: ${{ parameters.functionsWorkDir }}/app/main.py OVERRIDE_BUILD_NUMBER_ADO
          #     BUILD_NUMBER: $(Build.BuildNumber)
          #     COMMIT_ID: $(FLOW_GIT_SHORT_COMMIT_ID)
          #   displayName: "Bootstrap: Override build number"

          - bash: |
              source activate $FUNCTIONS_VENV
              python $EXECUTE_COMMAND
            env:
              FUNCTIONS_VENV: ${{ parameters.functionsVenv }}
              EXECUTE_COMMAND: ${{ parameters.functionsWorkDir }}/app/main.py WRITE_DIARY
              PUBLISH_PREFIX_PATH: "$(Build.ArtifactStagingDirectory)"
              PUBLISH_FILE_NAME: ${{ parameters.publishFileName }}
              GIT_URL: ${{ parameters.gitUrl }}
              GIT_COMMIT_ID: $(FLOW_GIT_COMMIT_ID)
              GIT_SHORT_COMMIT_ID: $(FLOW_GIT_SHORT_COMMIT_ID)
              DOCKER_SERVER_URI: ${{ parameters.dockerServerUri }}
              DOCKER_IMAGE_NAME: ${{ parameters.dockerImageName }}
              DOCKER_IMAGE_TAG: ${{ parameters.dockerImageTag }}
              IS_IMAGE_TAG_BASED_ON_ENV: ${{ parameters.dockerTagBaseOnEnv }}
              MANUALLY_PUBLIC_ENV_VARS : ${{ convertToJson(parameters.manuallyPublicEnvVars) }}
              MANUALLY_PRIVATE_ENV_VARS: ${{ convertToJson(parameters.manuallyPrivateEnvVars) }}
              HOST_PUBLIC_ENV_VARS: ${{ convertToJson(parameters.hostPublicEnvVars) }}
              HOST_PRIVATE_ENV_VARS: ${{ convertToJson(parameters.hostPrivateEnvVars) }}
              PIPELINE_NAME: $(Build.DefinitionName)
              BUILD_NUMBER: ${{ parameters.buildNumber }}
            displayName: "Bootstrap: Write diary"

          - task: PublishBuildArtifacts@1
            inputs:
              pathtoPublish: $(Build.ArtifactStagingDirectory)
              artifactName: ${{ parameters.bootstrapArtifactName }}
            displayName: "Bootstrap: Publish artifacts"

  - stage: Build
    dependsOn: Bootstrap
    jobs:
      - job: BuildDockerImage
        displayName: Build Docker image
        workspace:
          clean: all
        pool:
          ${{ if eq(parameters.runningAgent, 'ubuntu-latest') }}:
            vmImage: ${{ parameters.runningAgent }}
          ${{ if eq(parameters.runningAgent, 'azp-agent-ubuntu-docker') }}:
            name: ${{ parameters.runningAgent }}
          ${{ if eq(parameters.runningAgent, 'azp-agent-debian-docker') }}:
            name: ${{ parameters.runningAgent }}
        variables:
          - template: vars-cicd-k8s.yml
        steps:
          - ${{ parameters.checkoutBuildStage }}

          - task: AzureKeyVault@2
            inputs:
              azureSubscription: ${{ variables.FLOW_INFRA_CONFIG_VAULT_SERVICE_CONNECTION }}
              KeyVaultName: ${{ variables.FLOW_INFRA_CONFIG_VAULT_NAME }}
              SecretsFilter: "${{ join(',',parameters.stageEnvVars.build) }}"
              RunAsPreJob: true
            displayName: "Build: Fetch vars from vault"

          - bash: |
              echo "##vso[task.setvariable variable=PATH;]${CONDA_BIN_PATH}:${PATH}"
              echo "##vso[task.setvariable variable=PYTHONPATH;]${FUNCTIONS_WORK_DIR}:${PYTHONPATH}"
            env:
              CONDA_BIN_PATH: ${{ parameters.condaBinPath }}
              FUNCTIONS_WORK_DIR: "${{ parameters.functionsWorkDir }}"
            displayName: "Build: Set up env"

          - bash: |
              source activate $FUNCTIONS_VENV
              python $EXECUTE_COMMAND
            env:
              FUNCTIONS_VENV: ${{ parameters.functionsVenv }}
              EXECUTE_COMMAND: ${{ parameters.functionsWorkDir }}/app/main.py INITIALIZE_WORKSPACE
              STAGE_NAME: BUILD
              BUILD_BASE_DIR: "${{ parameters.workspaceWorkDir }}"
              APP_SOURCE: ${{ parameters.appFolder }}
              TARGET_BUILD_APP: "${{ parameters.targetBuildApp }}"
              TARGET_BUILD_OUTPUT: "${{ parameters.targetBuildOutput }}"
            displayName: "Build: Initialize workspace"

          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: "current"
              itemPattern: "**"
              targetPath: "$(FLOW_BUILD_SECTION_DIR)"
            displayName: "Build: Download Bootstrap artifact"

          - task: ExtractFiles@1
            inputs:
              archiveFilePatterns: "$(FLOW_BUILD_SECTION_DIR)/${{ parameters.bootstrapArtifactName }}/*.zip"
              destinationFolder: "$(FLOW_BUILD_APP_DIR)"
              overwriteExistingFiles: true
            displayName: "Build: Extract Bootstrap artifact"

          - bash: |
              source activate $FUNCTIONS_VENV
              python $EXECUTE_COMMAND
            env:
              ${{ each env_p in parameters.compileEnvVars }}:
                ${{ env_p.key }}: ${{ env_p.value }}
              FUNCTIONS_VENV: ${{ parameters.functionsVenv }}
              EXECUTE_COMMAND: ${{ parameters.functionsWorkDir }}/app/main.py COMPILE_PLATFORM
              TARGET_PLATFORM: MAVEN
              APP_SOURCE_DIR: $(FLOW_BUILD_APP_DIR)/${{ parameters.appFolder }}
              TARGET_SUB_DIR: ${{ parameters.targetSubDir }}
              TARGET_BUILD_APP: "${{ parameters.targetBuildApp }}"
              TARGET_BUILD_OUTPUT: "${{ parameters.targetBuildOutput }}"
              IS_USE_PRIVATE_LIBS: ${{ parameters.isUsePrivateLibs }}
              SETTINGS_XML_PATH: ${{ parameters.resourcesWorkDir }}/${{ parameters.mavenSettingsPath }}
            displayName: "Build: Compile platform"

          - bash: |
              source activate $FUNCTIONS_VENV
              python $EXECUTE_COMMAND
            env:
              FUNCTIONS_VENV: ${{ parameters.functionsVenv }}
              EXECUTE_COMMAND: ${{ parameters.functionsWorkDir }}/app/main.py DOCKER_BUILD
              PUBLISH_FILE_PATH: "$(FLOW_BUILD_SECTION_DIR)/${{ parameters.bootstrapArtifactName }}/${{ parameters.publishFileName }}"
              TARGET_BUILD_OUTPUT_PATH: "$(FLOW_TARGET_BUILD_OUTPUT_DIR)"
              TARGET_BUILD_DOCKER_PATH: "$(FLOW_BUILD_DOCKER_DIR)"
              DOCKER_IS_PRIVATE_REGISTRY: "true"
              DOCKER_SERVER_URI: ${{ parameters.dockerServerUri }}
              DOCKER_SERVER_USERNAME: ${{ parameters.dockerServerUsername }}
              DOCKER_SERVER_PASSWORD: ${{ parameters.dockerServerPassword }}
              DOCKER_RESOURCE_WORK_DIR: "${{ parameters.resourcesWorkDir }}/${{ parameters.dockerResources }}"
              DOCKER_TARGET_DOCKERFILE: "${{ parameters.dockerfilePath }}/."
              DOCKERS_ARGS_JSON: "${{ convertToJson(parameters.containerArgs) }}"
            displayName: "Build: Docker build"

  - ${{ if eq(parameters.isUnitTestStage, true) }}:
      - stage: UnitTest
        dependsOn: Bootstrap
        jobs:
          - job: RunUnitTest
            displayName: Run unit test
            workspace:
              clean: all
            pool:
              ${{ if eq(parameters.runningAgent, 'ubuntu-latest') }}:
                vmImage: ${{ parameters.runningAgent }}
              ${{ if eq(parameters.runningAgent, 'azp-agent-ubuntu-docker') }}:
                name: ${{ parameters.runningAgent }}
              ${{ if eq(parameters.runningAgent, 'azp-agent-debian-docker') }}:
                name: ${{ parameters.runningAgent }}
            variables:
              - template: vars-cicd-k8s.yml
            steps:
              - ${{ parameters.checkoutUnitTestStage }}

              - task: AzureKeyVault@2
                inputs:
                  azureSubscription: ${{ variables.FLOW_INFRA_CONFIG_VAULT_SERVICE_CONNECTION }}
                  KeyVaultName: ${{ variables.FLOW_INFRA_CONFIG_VAULT_NAME }}
                  SecretsFilter: "${{ join(',',parameters.stageEnvVars.unitTest) }}"
                  RunAsPreJob: true
                displayName: "UnitTest: Fetch vars from vault"

              - bash: |
                  echo "##vso[task.setvariable variable=PATH;]${CONDA_BIN_PATH}:${PATH}"
                  echo "##vso[task.setvariable variable=PYTHONPATH;]${FUNCTIONS_WORK_DIR}:${PYTHONPATH}"
                env:
                  CONDA_BIN_PATH: ${{ parameters.condaBinPath }}
                  FUNCTIONS_WORK_DIR: "${{ parameters.functionsWorkDir }}"
                displayName: "UnitTest: Set up env"

              - bash: |
                  source activate $FUNCTIONS_VENV
                  python $EXECUTE_COMMAND
                env:
                  FUNCTIONS_VENV: ${{ parameters.functionsVenv }}
                  EXECUTE_COMMAND: ${{ parameters.functionsWorkDir }}/app/main.py INITIALIZE_WORKSPACE
                  STAGE_NAME: UNIT_TEST
                  UNIT_TEST_BASE_DIR: "${{ parameters.workspaceWorkDir }}"
                  APP_SOURCE: ${{ parameters.appFolder }}
                  TARGET_UNIT_TEST_APP: ${{ parameters.targetUnitTestApp }}
                  TARGET_UNIT_TEST_OUTPUT: ${{ parameters.targetUnitTestOutput }}
                displayName: "UnitTest: Initialize workspace"

              - task: DownloadPipelineArtifact@2
                inputs:
                  buildType: "current"
                  itemPattern: "**"
                  targetPath: "$(FLOW_UNIT_TEST_SECTION_DIR)"
                displayName: "UnitTest: Download Bootstrap artifact"

              - task: ExtractFiles@1
                inputs:
                  archiveFilePatterns: "$(FLOW_UNIT_TEST_SECTION_DIR)/${{ parameters.bootstrapArtifactName }}/*.zip"
                  destinationFolder: "$(FLOW_UNIT_TEST_SECTION_DIR)"
                  cleanDestinationFolder: false
                  overwriteExistingFiles: true
                displayName: "UnitTest: Extract Bootstrap artifact"

              - bash: |
                  source activate $FUNCTIONS_VENV
                  python $EXECUTE_COMMAND
                env:
                  FUNCTIONS_VENV: ${{ parameters.functionsVenv }}
                  EXECUTE_COMMAND: ${{ parameters.functionsWorkDir }}/app/main.py RUN_UNIT_TEST_PLATFORM
                  PICKED_PLATFORM: MAVEN
                  APP_SOURCE_DIR: $(FLOW_UNIT_TEST_SECTION_DIR)/${{ parameters.appFolder }}
                  TARGET_SUB_DIR: ${{ parameters.targetSubDir }}
                  TARGET_UNIT_TEST_APP: "${{ parameters.targetUnitTestApp }}"
                  TARGET_UNIT_TEST_OUTPUT: "${{ parameters.targetUnitTestOutput }}"
                  IS_USE_PRIVATE_LIBS: ${{ parameters.isUsePrivateLibs }}
                  SETTINGS_XML_PATH: ${{ parameters.resourcesWorkDir }}/${{ parameters.mavenSettingsPath }}
                  ${{ each env_p in parameters.compileEnvVars }}:
                    ${{ env_p.key }}: ${{ env_p.value }}
                displayName: "UnitTest: Run unit test"

              - task: PublishTestResults@2
                inputs:
                  testResultsFormat: "JUnit"
                  testResultsFiles: "$(FLOW_TARGET_UNIT_TEST_OUTPUT_DIR)/${{ parameters.targetUnitTestOutputFilter }}"
                displayName: "UnitTest: Expose the report"
